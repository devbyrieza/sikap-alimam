name: Build & Deploy to GHCR (Unlimited Free)

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Push GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🐋 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚡ Trigger Coolify Deploy (Pull Image)
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ]; then
            echo "Triggering Coolify deployment via Webhook..."
            curl -s -X GET "$COOLIFY_WEBHOOK"
            echo "Coolify deployment triggered successfully!"
          else
            echo "No COOLIFY_WEBHOOK secret found. Please add it to GitHub Repository Secrets!"
            exit 1
          fi
